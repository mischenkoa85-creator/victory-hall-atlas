<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Атлас Victory Hall</title>
<style>
:root{
  --bg:#e9eae6; --panel:#ffffff; --panel2:#f3f4f1; --ink:#1c2226; --ink2:#566068; --line:#d5d8d3;
  --tile:#2f3336; --glass:#6e8797; --amber:#f0a21e; --amber-ink:#5a3a00; --ok:#2e7d5b; --bad:#b3372b;
  --r:14px; --shadow:0 6px 28px rgba(28,34,38,.16);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#15181a; --panel:#22272a; --panel2:#2b3135; --ink:#eef0ee; --ink2:#a3adb3; --line:#3a4246;
  --tile:#0e1011; --amber-ink:#ffd58a; --shadow:0 6px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* верхня смуга */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe-t) + 8px) 10px 8px 12px;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#ttl{flex:1;min-width:0;pointer-events:none}
#ttl .t{font-weight:750;font-size:17px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl .s{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl .t,#ttl .s{text-shadow:0 0 6px var(--bg),0 0 6px var(--bg),0 0 3px var(--bg)}
.ib{height:44px;min-width:44px;padding:0 11px;flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:22px;font-weight:600;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:6px}
.ib.on{background:var(--tile);color:#fff;border-color:var(--tile)}
:root[data-theme="dark"] .ib.on{background:var(--amber);color:#201400;border-color:var(--amber)}
#back{background:var(--tile);color:#fff;border-color:var(--tile)}
:root[data-theme="dark"] #back{background:var(--panel2);color:var(--ink);border-color:var(--line)}
[hidden]{display:none!important}

/* пошук */
#searchbar{position:fixed;left:10px;right:10px;top:calc(var(--safe-t) + 62px);z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;max-width:520px}
#search{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel2);font-size:16px}
#search.miss{border-color:var(--bad)}
#sres{display:flex;flex-direction:column;margin-top:6px;max-height:44vh;overflow:auto}
#sres button{text-align:left;border:0;background:none;padding:11px 6px;border-bottom:1px solid var(--line);font-size:15px}
#sres button small{display:block;color:var(--ink2);font-size:12.5px}

/* панель поверхів — як кнопки в ліфті */
#rail{position:fixed;right:8px;top:calc(var(--safe-t) + 64px);bottom:calc(var(--safe-b) + 104px);width:50px;z-index:4;display:flex;flex-direction:column;background:var(--tile);border-radius:25px;padding:5px;box-shadow:var(--shadow);overflow:hidden}
#railscroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;scrollbar-width:none;padding:2px 0}
#railscroll::-webkit-scrollbar{display:none}
#rail button{flex:0 0 auto;width:40px;height:34px;border-radius:17px;border:1.5px solid #5d666b;background:#3a4045;color:#e8ebe8;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;padding:0}
#rail button.on{background:var(--amber);border-color:#ffd58a;color:#241700;box-shadow:0 0 0 2px rgba(240,162,30,.35)}
#rail button.all{height:40px;border-radius:20px;margin-bottom:5px;background:#e8ebe8;color:#1c2226;border-color:#e8ebe8;font-size:18px}
#rail button.all.on{background:var(--amber);border-color:#ffd58a}
#rail button.roof{font-size:11.5px;letter-spacing:-.02em}

#compass{position:fixed;left:12px;bottom:calc(var(--safe-b) + 112px);width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.1);pointer-events:none}
#needle{position:absolute;left:50%;top:50%;width:17px;height:2.5px;background:var(--bad);transform-origin:0 50%;border-radius:2px}
#needle::after{content:"Пн";position:absolute;left:19px;top:-8px;font-size:10px;font-weight:700;color:var(--ink2)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 66px);z-index:20;background:var(--tile);color:#fff;padding:10px 16px;border-radius:22px;font-size:14.5px;max-width:86vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

/* нижня панель */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:var(--shadow);border-top:1px solid var(--line);height:86vh;transform:translateY(calc(86vh - 96px - var(--safe-b)));transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;will-change:transform}
#sheet.drag{transition:none}
#sheet.half{transform:translateY(calc(86vh - 46vh))}
#sheet.full{transform:translateY(0)}
#grab{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
#grab i{width:44px;height:5px;border-radius:3px;background:var(--line)}
#sheethead{flex:0 0 auto;padding:0 16px 10px;display:flex;align-items:flex-start;gap:10px;touch-action:none}
#sheethead .h{flex:1;min-width:0}
#sheethead .h b{font-size:19px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheethead .h span{display:block;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheethead .x{flex:0 0 auto;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);font-size:17px}
#sheetbody{flex:1;overflow-y:auto;padding:2px 16px calc(var(--safe-b) + 22px);-webkit-overflow-scrolling:touch}
#sheethead .h b{display:flex;align-items:center;gap:8px}
.demo{display:inline-block;font-style:normal;flex:0 0 auto;background:var(--amber);color:#241700;font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px;letter-spacing:.06em;vertical-align:2px;margin-left:6px}
.pass-top{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.pass-top canvas{width:96px;height:96px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);flex:0 0 auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:15px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums}
.sec{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:10px}
.sec h3{margin:0 0 8px;font-size:15px;font-weight:750;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 small{font-weight:500;color:var(--ink2);font-size:12.5px}
.per{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:0 8px;font-size:14.5px}
table.rd{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
table.rd th{font-weight:500;color:var(--ink2);text-align:right;font-size:12.5px;padding:2px 0 4px 8px}
table.rd th:first-child,table.rd td:first-child{text-align:left;padding-left:0}
table.rd td{text-align:right;padding:5px 0 5px 8px;border-top:1px solid var(--line)}
table.rd td.c{font-weight:750}
.meter{font-size:13px;color:var(--ink2);margin:0 0 4px}
.big{font-size:26px;font-weight:780;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:4px}
.debt .big{color:var(--bad)} .debt.zero .big{color:var(--ok)}
.muted{color:var(--ink2);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 10px}
.chips button{height:40px;min-width:54px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:650;font-size:15px;font-variant-numeric:tabular-nums}
.chips button.d{border-color:var(--amber)}
.act{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.act button{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--tile);color:#fff;font-weight:650}
:root[data-theme="dark"] .act button{background:var(--amber);color:#201400}
.act button.sec2{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.flag{background:#fff3cd;color:#5a4300;border-radius:8px;padding:7px 10px;font-size:13.5px;margin:6px 0}
:root[data-theme="dark"] .flag{background:#4a3a10;color:#ffe3a0}
dl.meta{margin:8px 0 0;font-size:14px}
dl.meta dt{color:var(--ink2);font-size:12.5px;margin-top:8px}
dl.meta dd{margin:1px 0 0;overflow-wrap:anywhere}

/* інженерний режим */
#eng{position:fixed;z-index:12;left:0;top:0;bottom:0;width:min(360px,88vw);background:var(--panel);border-right:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .25s}
#eng.open{transform:none}
#eng header{padding:calc(var(--safe-t) + 12px) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
#eng header b{flex:1;font-size:17px}
#engbody{flex:1;overflow-y:auto;padding:4px 14px calc(var(--safe-b) + 24px);-webkit-overflow-scrolling:touch}
#engbody h2{font-size:14px;font-weight:750;margin:18px 0 8px;display:flex;justify-content:space-between;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid button,.lamps button{min-height:40px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;font-size:13.5px;padding:6px 8px}
.grid button.on{background:var(--tile);color:#fff;border-color:var(--tile)}
.layer{display:flex;align-items:center;gap:10px;min-height:38px;font-size:14.5px}
.layer input{width:22px;height:22px;accent-color:var(--amber);flex:0 0 auto}
.layer.proj span::after{content:" проєкт";font-size:11px;font-weight:700;color:var(--amber-ink);background:rgba(240,162,30,.25);border-radius:5px;padding:1px 5px;margin-left:6px;white-space:nowrap}
#cut{width:100%;accent-color:var(--amber);height:34px}
.lamps{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.lamp.em{border-color:#2f6fe0}.lamp.rv{border-style:dashed}.lamp.on{outline:2px solid var(--amber)}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
summary{font-weight:650;font-size:14.5px;min-height:38px;display:flex;align-items:center;cursor:pointer}
ul.plain{margin:6px 0;padding-left:18px;font-size:13px;color:var(--ink2)}
ul.plain li{margin-bottom:6px;overflow-wrap:anywhere}
ul.plain a{color:inherit}
#scrim{position:fixed;inset:0;z-index:11;background:rgba(0,0,0,.28)}

#loading{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#loading .bar{width:min(260px,70vw);height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#loading .bar i{display:block;height:100%;width:8%;background:var(--amber);transition:width .25s}
#loading b{font-size:20px} #loadmsg{color:var(--ink2);font-size:14.5px;max-width:520px}

@media (min-width:900px){
  #sheet{left:16px;right:auto;width:420px;border-radius:20px;bottom:16px;height:min(80vh,760px);transform:translateY(calc(min(80vh,760px) - 92px));border:1px solid var(--line)}
  #sheet.half,#sheet.full{transform:none}
  #rail{right:16px;bottom:24px;top:76px}
  #compass{left:452px;bottom:24px}
  #ttl .t{font-size:19px}
}
@media (prefers-reduced-motion:reduce){#sheet,#eng,#toast{transition:none}}

/* ── атлас будинку: паспорти приміщень і обслуговування ── */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181a; --panel:#22272a; --panel2:#2b3135; --ink:#eef0ee; --ink2:#a3adb3; --line:#3a4246;
    --tile:#0e1011; --amber-ink:#ffd58a; --shadow:0 6px 28px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{color-scheme:dark}
:root{--wash:rgba(240,162,30,.16); --okbg:#dcefe5; --okfg:#1f5c42; --nobg:#f6dfdb; --nofg:#8f2a20; --ptbg:#fbe9c8; --ptfg:#7a4a00; --nwbg:#e1e7f4; --nwfg:#2f4a85; --bar:#2f3336; --bar2:#c9cdc8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wash:rgba(240,162,30,.2); --okbg:#1d3b2e; --okfg:#9fe0bf; --nobg:#4a2420; --nofg:#ffb4a8; --ptbg:#4a3a10; --ptfg:#ffe3a0; --nwbg:#24304a; --nwfg:#b7c8f0; --bar:#e8ebe8; --bar2:#5d666b}}
:root[data-theme="dark"]{--wash:rgba(240,162,30,.2); --okbg:#1d3b2e; --okfg:#9fe0bf; --nobg:#4a2420; --nofg:#ffb4a8; --ptbg:#4a3a10; --ptfg:#ffe3a0; --nwbg:#24304a; --nwfg:#b7c8f0; --bar:#e8ebe8; --bar2:#5d666b}

#png,#glb{display:none!important}
body.boot #loading[hidden]{display:flex!important}
@media (max-width:899px){#compass{bottom:calc(var(--safe-b) + 166px)}}
.chips button.d{border-color:var(--line)}

#gofl{position:fixed;left:12px;top:calc(var(--safe-t) + 60px);z-index:5;height:42px;padding:0 14px 0 12px;border-radius:21px;
  display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#241700;font-weight:700;font-size:15px;
  text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.18)}
@media (min-width:900px){#gofl{left:16px}}
#gofl:focus-visible,.x14 a:focus-visible,.x14 button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.x14{font-variant-numeric:tabular-nums}
.x14 .tabs,.f14 .tabs{position:sticky;top:-2px;z-index:2;background:var(--panel);display:flex;gap:0;margin:6px -16px 0;padding:0 6px;border-bottom:1px solid var(--line)}
.x14 .tabs::-webkit-scrollbar{display:none}
.x14 .tabs button,.f14 .tabs button{flex:1 1 0;min-width:0;border:0;background:none;padding:12px 0 10px;font-size:12px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.f14 .tabs button{font-size:13.5px}
.x14 .tabs button.on,.f14 .tabs button.on{color:var(--ink);border-bottom-color:var(--amber)}
.x14 .pane,.f14 .pane{padding-top:4px}
.x14 .sig{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.x14 .chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650;padding:4px 9px;border-radius:7px;background:var(--panel2);color:var(--ink)}
.x14 .chip.ok{background:var(--okbg);color:var(--okfg)} .x14 .chip.no{background:var(--nobg);color:var(--nofg)}
.x14 .chip.pt{background:var(--ptbg);color:var(--ptfg)} .x14 .chip.nw{background:var(--nwbg);color:var(--nwfg)}
.x14 .who{font-size:18px;font-weight:750;margin:2px 0 8px}
.x14 .cts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.x14 .ct{min-height:52px;border-radius:12px;background:var(--tile);color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:650}
:root[data-theme="dark"] .x14 .ct{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.x14 .cp{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:42px;padding:3px 0;border-top:1px solid var(--line);font-size:14px}
.x14 .cp .l{color:var(--ink2);font-size:13px}
.x14 .cp .v{font-weight:650;overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
.x14 .cp button{height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;font-weight:600}
.x14 .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.x14 .seg button{height:32px;padding:0 9px;border:0;background:none;font-size:13px;font-weight:600;color:var(--ink2)}
.x14 .seg button+button{border-left:1px solid var(--line)}
.x14 .seg button.on{background:var(--tile);color:#fff}
:root[data-theme="dark"] .x14 .seg button.on{background:var(--amber);color:#201400}
.x14 .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.x14 .tl{background:var(--panel2);border-radius:12px;padding:10px 12px;min-width:0}
.x14 .tl .k{font-size:12.5px;color:var(--ink2)}
.x14 .tl .n{font-size:20px;font-weight:780;letter-spacing:-.01em;margin:2px 0 1px;white-space:nowrap}
.x14 .tl .n small{font-size:12.5px;font-weight:500;color:var(--ink2);margin-left:3px}
.x14 .tl .n.none{color:var(--ink2);font-weight:650;font-size:16px}
.x14 .tl .s{font-size:12px;color:var(--ink2)}
.x14 .meter{font-size:13px;color:var(--ink2);margin:0 0 6px}
.x14 table.rd td.t{border-top:2px solid var(--ink2)}
.x14 .kv{margin-top:6px;font-size:14px}
.x14 .kv dd{font-weight:600;overflow-wrap:anywhere}
.x14 .kv dd.miss{color:var(--nofg);font-weight:500}
.x14 .parts,.m14 .parts{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.x14 .parts li,.m14 .parts li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.x14 .parts li b,.m14 .parts li b{font-weight:650;white-space:nowrap}
.x14 .parts li span small,.m14 .parts li span small{display:block;color:var(--ink2);font-size:12px}
.x14 .muted{margin:6px 0 0}
.x14 .bars{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line);padding:0 2px;margin-top:8px}
.x14 .bars div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:100%}
.x14 .bars i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--bar)}
.x14 .bars i.p{background:var(--bar2)} .x14 .bars i.s{background:var(--amber)}
.x14 .bars span{font-size:9px;color:var(--ink2);white-space:nowrap}
.x14 .bl{display:flex;gap:4px;padding:0 2px;margin-top:3px}
.x14 .bl span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--ink2)}
.x14 .person{border-top:1px solid var(--line);padding:10px 0}
.x14 .person .nm{font-weight:700;font-size:15px}
.x14 .person .rl{font-size:12.5px;color:var(--ink2)}
.x14 .flag2{background:var(--ptbg);color:var(--ptfg);border-radius:8px;padding:7px 10px;font-size:13px;margin:6px 0}
.x14 .scroll{overflow-x:auto;margin:0 -2px}

.f14{margin-top:6px}
.f14 table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.f14 th{font-weight:500;color:var(--ink2);font-size:11.5px;text-align:right;padding:4px 0 6px 6px}
.f14 th:first-child,.f14 td:first-child,.f14 th:nth-child(2),.f14 td:nth-child(2){text-align:left}
.f14 td{padding:7px 0 7px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.f14 td:nth-child(2){white-space:normal;max-width:110px}
.f14 tr.r{cursor:pointer}
.f14 tr.r:hover td{background:var(--panel2)}
.f14 .pos{color:var(--okfg);font-weight:650} .f14 .neg{color:var(--nofg);font-weight:650}
.f14 .tot td{font-weight:750;border-top:2px solid var(--ink2)}

      h += '<details class="stock"><summary>Склад: ' + esc(s.title.toLowerCase()) + ' — <b>' + s.now + ' шт</b></summary><table class="rd"><tr><th>Коли</th><th>Що</th><th>Шт</th></tr>' +
        s.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + (r[3] ? '<br><span class="ar">' + esc(r[3]) + '</span>' : '') + '</td><td class="c">' + r[2] + '</td></tr>'; }).join('') + '</table></details>';
    });
    h += '<p class="muted">Журнали: <a href="' + esc(B.src.lamps.url) + '" target="_blank" rel="noopener">' + esc(B.src.lamps.title) + '</a>, <a href="' + esc(B.src.sensors.url) + '" target="_blank" rel="noopener">' + esc(B.src.sensors.title) + '</a>.</p></div>';
    }
    if (B.not_in_model.length) h += '<p class="note">У ДАХ є, а в моделі немає: ' + B.not_in_model.map(function (k) { return TL[k.split(':')[0]].sh + ' ' + k.split(':')[1]; }).join(', ') + '.</p>';
    h += '<p class="note">' + (ULK() ? 'Паспорти приміщень підвантажуються, коли відкриваєте поверх або приміщення. Дані відкрито ключем правління — посилання з ключем не пересилати.' : 'Це відкрита сторінка: модель будинку без даних мешканців.') + '</p>';
    return h + '</div>';
  }

  /* ---------- вставка в картку ---------- */
  function selFloor() { var s = window.P00.state(); return s.sel.length === 1 ? s.sel[0] : null; }
  function apply() {
    var body = $('sheetbody'); if (!body) return;
    var dds = body.querySelectorAll('.pass-top .kv dd');
    if (!dds.length) {
      if (body.querySelector('.f14') || body.querySelector('.m14') || body.querySelector('.fb')) return;
      var s = window.P00.state();
      if (!s.sel.length && body.querySelector('[data-eng]')) {
        body.querySelectorAll('p.muted').forEach(function (p) { if (/вигадані|зразок даних/.test(p.textContent)) p.remove(); });
        var g = body.querySelector('[data-go]'); if (g) g.textContent = 'Відкрити 14-й поверх';
        var b = document.createElement('div'); b.className = 'fb'; b.innerHTML = bldHTML(); body.appendChild(b); return;
      }
      if (s.sel.length === 1 && !s.picked) {
        var fl = s.sel[0];
        var chs = body.querySelector('.chips');
        if (chs && chs.children.length > 24 && !chs.closest('details')) {
          var det = document.createElement('details'); det.className = 'chipsd';
          det.innerHTML = '<summary>Усі приміщення кнопками · ' + chs.children.length + '</summary>';
          chs.parentNode.insertBefore(det, chs); det.appendChild(chs);
        }
        var f = document.createElement('div'); f.className = 'f14'; f.dataset.fl = fl; f.innerHTML = floorHTML(fl); body.appendChild(f);
        if (!data[fl]) load(fl).then(function () { var x = document.querySelector('#sheetbody .f14'); if (x && +x.dataset.fl === fl) x.innerHTML = floorHTML(fl); }, function (e) { var x = document.querySelector('#sheetbody .f14'); if (x) x.innerHTML = '<div class="flag2">Дані поверху не завантажено: ' + esc(e.message) + '. Оновіть сторінку.</div>'; });
        return;
      }
      if (lastSel && !lastSel.key && lastSel.floor != null) {
        var flo = lastSel.floor, id = lastSel.id;
        var put = function () {
          var d = data[flo]; if (!d || !lastSel || lastSel.id !== id) return;
          var q = d.equip.filter(function (x) { return x.id === id; })[0]; if (!q) return;
          var bd = $('sheetbody'); if (bd.querySelector('.m14')) return;
          var box = document.createElement('div'); box.className = 'm14'; box.innerHTML = objHTML(q, d); bd.insertBefore(box, bd.firstChild); bd.scrollTop = 0;
          if (q.kind === 'lamp' && q.line) $('sh-t').textContent = 'Світильник ' + q.code + ' · ' + q.line;
        };
        if (data[flo]) put(); else load(flo).then(put, function () {});
      }
      return;
    }
    var key = dds[dds.length - 1].textContent.trim();
    var pd = $('pdata'); if (!pd || /Завантажую/.test(pd.textContent)) return;
    if (pd.querySelector('.x14') || pd.querySelector('.ldx')) return;
    var fl2 = KF[key];
    var show = function () {
      var p2 = $('pdata'); if (!p2) return;
      var kd = document.querySelectorAll('#sheetbody .pass-top .kv dd'); if (!kd.length || kd[kd.length - 1].textContent.trim() !== key) return;
      var a = unitByKey(key);
      var old = p2.querySelector('.ldx'); if (old) old.remove();
      if (!a) {
        if (!p2.querySelector('.flag2')) {
          var st0 = !ULK() && p2.querySelector('.sec'); if (st0) st0.remove();
          p2.insertAdjacentHTML('afterbegin', '<div class="flag2">' + (ULK() ? 'Паспорта для «' + esc(key) + '» немає в даних.' : 'Паспорт цього приміщення закрито. ' + LOCKMSG) + '</div>');
        }
        return;
      }
      if (p2.querySelector('.x14')) return;
      if (cur !== key) { cur = key; }
      var box = document.createElement('div'); box.className = 'x14'; box.innerHTML = render(a);
      var stub = p2.querySelector('.sec');
      if (stub) stub.replaceWith(box); else p2.insertBefore(box, p2.firstChild);
    };
    if (fl2 != null && data[fl2]) show();
    else {
      pd.insertAdjacentHTML('afterbegin', '<p class="muted ldx">Завантажую паспорт…</p>');
      load(fl2).then(show, function (e) { var p3 = $('pdata'); if (p3) { var o = p3.querySelector('.ldx'); if (o) o.outerHTML = '<div class="flag2">Паспорт не завантажено: ' + esc(e.message) + '. Оновіть сторінку.</div>'; } });
    }
  }
  function rerender() {
    var box = document.querySelector('#pdata .x14'); if (!box || !cur) return;
    var a = unitByKey(cur); if (!a) return;
    var y = $('sheetbody').scrollTop; box.innerHTML = render(a); $('sheetbody').scrollTop = y;
  }
  function openKey(k) { Promise.resolve(window.P00.select(k, true)).then(function () { window.P00.sheet('half'); }); }
  function openFloor(tab, fl) {
    st.ftab = tab;
    var f = document.querySelector('#sheetbody .f14');
    var go = function () {
      window.P00.sheet('half');
      setTimeout(function () {
        var g = document.querySelector('#sheetbody .f14'), sb = $('sheetbody'); if (!g) return;
        sb.scrollTop = tab === 's' ? sb.scrollTop + g.getBoundingClientRect().top - sb.getBoundingClientRect().top - 2 : 0;
      }, 80);
    };
    if (f && (fl == null || +f.dataset.fl === fl)) { f.innerHTML = floorHTML(+f.dataset.fl); go(); }
    else if (fl != null && selFloor() !== fl) Promise.resolve(window.P00.setFloors([fl])).then(go);
    else Promise.resolve(window.P00.select(-1, false)).then(go);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : null; if (!t) return;
    var b = t.closest('.x14 [data-tab]');
    if (b) { st.tab = b.dataset.tab; rerender(); $('sheetbody').scrollTop = Math.min($('sheetbody').scrollTop, 120); return; }
    b = t.closest('.x14 [data-per]');
    if (b) { st.per = b.dataset.per; rerender(); return; }
    b = t.closest('[data-copy]');
    if (b && b.closest('.x14')) {
      var done = function () { b.textContent = 'Скопійовано'; setTimeout(function () { b.textContent = 'Копіювати'; }, 1400); };
      var pick = function () { var v = b.parentNode.querySelector('.v'); if (v) { var r = document.createRange(); r.selectNodeContents(v); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } };
      try { navigator.clipboard.writeText(b.dataset.copy).then(done, pick); } catch (err) { pick(); }
      return;
    }
    b = t.closest('.f14 [data-ftab]');
    if (b) { openFloor(b.dataset.ftab); return; }
    b = t.closest('#sheetbody [data-obj]');
    if (b) { openKey(b.dataset.obj); return; }
    b = t.closest('.m14 [data-gosvc]');
    if (b) { openFloor('s', lastSel ? lastSel.floor : null); return; }
    b = t.closest('#sheetbody [data-key]');
    if (b) openKey(b.dataset.key);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var r = e.target.closest && e.target.closest('.f14 tr[data-key]'); if (r) openKey(r.dataset.key);
  });

  function deep() {
    var h = location.hash.replace('#', ''), m;
    var TYPES = { kv: 'apt', mm: 'parking', kom: 'storage', prim: 'nonres' };
    if ((m = h.match(/^(kv|mm|kom|prim)([0-9]+[A-Za-zА-Яа-я0-9-]*)$/))) return openKey(TYPES[m[1]] + ':' + m[2]);
    if ((m = h.match(/^(f|o)([0-9]{1,2}|c)$/))) {
      var want = m[2] === 'c' ? 'Цоколь' : m[2] + '-й поверх', fl = null;
      Object.keys(FLN).forEach(function (k) { if (FLN[k] === want) fl = +k; });
      if (fl != null) return openFloor(m[1] === 'o' ? 's' : 'a', fl);
    }
  }
  function start() {
    var P = window.P00;
    if (ULK() && window.AtlasKey.full) Object.keys(window.AtlasKey.full).forEach(function (k) { B[k] = window.AtlasKey.full[k]; });
    window.AtlasData.getUnit = function (key, period) { return Promise.resolve({ unit: key, period: period, meters: null, demo: false }); };
    if (window.__hostTheme === 'dark' || window.__hostTheme === 'light') P.theme(window.__hostTheme);
    else if (window.matchMedia) {
      var mq = matchMedia('(prefers-color-scheme: dark)');
      var on = function () { P.theme(mq.matches ? 'dark' : 'light'); };
      on(); if (mq.addEventListener) mq.addEventListener('change', on); else if (mq.addListener) mq.addListener(on);
    }
    new MutationObserver(apply).observe($('sheetbody'), { childList: true, subtree: true });
    var upd = function () { var s = P.state(); $('gofl').hidden = !(s.sel.length === 1 && s.picked); };
    window.addEventListener('atlas:select', function (e) {
      lastSel = e.detail;
      if (e.detail && e.detail.floor != null) load(e.detail.floor).then(function () {}, function () {});
      if (booted) upd();
    });
    apply();
    document.body.classList.remove('boot');
    booted = true; upd();
    $('gofl').addEventListener('click', function (e) { e.preventDefault(); openFloor(st.ftab); });
    new MutationObserver(function () { if (booted) upd(); }).observe($('sh-t'), { childList: true, characterData: true, subtree: true });
    deep();
  }
  (function wait() {
    if (window.P00 && window.P00.ready && (!window.AtlasKey || window.AtlasKey.settled)) return start();
    if (window.__failed) return;
    setTimeout(wait, 50);
  })();
})();
</script>
